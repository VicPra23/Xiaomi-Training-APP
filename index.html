<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Xiaomi Training APP</title>
    <link rel="icon" href="./Xiaomi_logo_(2021-).svg.png" type="image/png">
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons (Vectorial) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- HEIC to JPEG Converter (v0.0.4) -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css?v=45.9">
    
    <!-- TomSelect (Necesario para ReportForm) -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    
    <!-- PWA & Mobile Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6700">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <a class="skip-link" href="#mainContent">Saltar al contenido</a>
    <div id="navOverlay" class="nav-overlay"></div>

    <nav class="glass-nav" id="navbar" style="display: none;" aria-label="Navegación principal">
        <div class="nav-container">
            <a href="#dashboard" class="nav-brand" aria-label="Xiaomi Trainer Platform · Inicio">
                <img src="./Xiaomi_logo_(2021-).svg.png" alt="" width="32" height="32">
                <div class="brand-info">
                    <strong class="brand-text">Xiaomi</strong>
                    <span class="brand-subtext">Trainer Platform</span>
                </div>
            </a>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-btn" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="navLinks">
                <i data-lucide="menu"></i>
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="#dashboard" class="nav-link"><i data-lucide="layout-dashboard"></i><span>Resumen</span></a></li>
                <li><a href="#report" class="nav-link"><i data-lucide="square-pen"></i><span>Reporte</span></a></li>
                <li><a href="#calendar" class="nav-link"><i data-lucide="calendar-days"></i><span>Calendario</span></a></li>
                <li><a href="#vacations" class="nav-link"><i data-lucide="umbrella"></i><span>Vacaciones</span></a></li>
                <li><a href="#materials" class="nav-link"><i data-lucide="library"></i><span>Materiales</span></a></li>
                <li><a href="#mensajes" class="nav-link"><i data-lucide="inbox"></i><span>Mensajes</span></a></li>
            </ul>
            <div class="nav-actions">
                    <a href="#mensajes" class="nav-mobile-inbox" title="Mensajes" aria-label="Abrir mensajes">
                        <i data-lucide="inbox"></i>
                    </a>
                    <div class="nav-user" id="navUser" aria-label="Sesión actual">
                        <span class="nav-user-avatar" id="navUserAvatar">XT</span>
                        <span class="nav-user-copy"><strong id="navUserName">Equipo</strong><small id="navUserRole">Trainer</small></span>
                    </div>
                    <button type="button" onclick="window.toggleTheme()" class="theme-toggle-btn" title="Cambiar tema" aria-label="Cambiar tema">
                        <i data-lucide="sun" class="sun-icon"></i>
                        <i data-lucide="moon" class="moon-icon"></i>
                    </button>
                    <a href="#" id="logoutBtn" class="nav-link danger" title="Cerrar sesión" aria-label="Cerrar sesión"><i data-lucide="log-out"></i></a>
            </div>
        </div>
    </nav>

    <main class="app-container" id="mainContent" tabindex="-1">
        <div id="appStatusRegion" class="app-status-region" aria-live="polite"></div>
        <div id="app">
        <!-- Vistas dinámicas -->
        </div>
    </main>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    
    <!-- Vistas y Lógica -->
    <script src="src/services/api.js?v=45.9"></script>
    <script src="src/views/Login.js?v=45.9"></script>
    <script src="src/views/Dashboard.js?v=45.9"></script>
    <script src="src/views/ReportForm.js?v=45.9"></script>
    <script src="src/views/Calendar.js?v=45.9"></script>
    <script src="src/views/Vacations.js?v=45.9"></script>
    <script src="src/views/Materials.js?v=45.9"></script>
    <script src="src/views/Messages.js?v=45.9"></script>
    <script src="src/main.js?v=45.9"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    reg.onupdatefound = () => {
                        const installingWorker = reg.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    const notice = document.createElement('button');
                                    notice.type = 'button';
                                    notice.className = 'app-update-notice';
                                    notice.textContent = 'Nueva versión disponible · Actualizar';
                                    notice.onclick = () => {
                                        installingWorker.postMessage('SKIP_WAITING');
                                        window.location.reload();
                                    };
                                    document.body.appendChild(notice);
                                }
                            // Insert update button next to user in sidebar
                            const navUser = document.getElementById('navUser');
                            if (navUser && !document.getElementById('sidebarUpdateBtn')) {
                                const sidebarBtn = document.createElement('button');
                                sidebarBtn.id = 'sidebarUpdateBtn';
                                sidebarBtn.className = 'btn-primary btn-compact';
                                sidebarBtn.style = 'margin-left: auto; font-size: 0.7rem; padding: 4px 8px; background: var(--xiaomi-orange); color: white; display: flex; align-items: center; gap: 4px;';
                                sidebarBtn.innerHTML = '<i data-lucide="download" style="width:14px; height:14px;"></i> Actualizar';
                                sidebarBtn.onclick = () => window.location.reload(true);
                                navUser.appendChild(sidebarBtn);
                                if (typeof lucide !== 'undefined') lucide.createIcons();
                            }
                            }
                        };
                    };
                }).catch(() => {});
            });
        }
    </script>
</body>
</html>

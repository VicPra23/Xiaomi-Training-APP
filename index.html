    <!-- Scripts -->

    <script src="src/services/api.js?v=46.7"></script>
    <script src="src/views/Login.js?v=46.7"></script>
    <script src="src/main.js?v=46.7"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                let hadController = Boolean(navigator.serviceWorker.controller);
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!hadController) {
                        hadController = true;
                        return;
                    }
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });

                const showUpdateNotice = worker => {
                    if (!worker || document.getElementById('appUpdateNotice')) return;
                    const notice = document.createElement('button');
                    notice.id = 'appUpdateNotice';
                    notice.type = 'button';
                    notice.className = 'app-update-notice';
                    notice.textContent = 'Nueva versión disponible · Actualizar';
                    notice.addEventListener('click', () => {
                        notice.disabled = true;
                        notice.textContent = 'Actualizando…';
                        worker.postMessage('SKIP_WAITING');
                    }, { once: true });
                    document.body.appendChild(notice);
                };

                navigator.serviceWorker.register('./sw.js').then(registration => {
                    if (registration.waiting && navigator.serviceWorker.controller) {
                        showUpdateNotice(registration.waiting);
                    }
                    registration.addEventListener('updatefound', () => {
                        const worker = registration.installing;
                        if (!worker) return;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                showUpdateNotice(worker);
                            }
                        });
                    });
                }).catch(error => console.warn('No se pudo registrar el modo offline.', error));
            });
        }
    </script>
</body>
